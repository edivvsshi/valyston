<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pagina nu există · Brutăria Valyston</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#12100e">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="/valyston/favicon.svg" type="image/svg+xml">
  <style>
    @font-face{font-family:'Switzer';font-weight:400;font-display:swap;src:url(/valyston/fonts/switzer-400.woff2) format('woff2')}
    @font-face{font-family:'Switzer';font-weight:600;font-display:swap;src:url(/valyston/fonts/switzer-600.woff2) format('woff2')}
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;display:flex;flex-direction:column;justify-content:space-between;min-height:100svh;overflow:hidden;background:#12100e;color:#f5f5f2;font:400 clamp(1.0625rem,1rem + .25vw,1.1875rem)/1.5 'Switzer',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;-webkit-font-smoothing:antialiased}
    a{color:inherit;-webkit-tap-highlight-color:transparent}
    :focus-visible{outline:3px solid #ffc94a;outline-offset:3px}
    .top{padding:14px clamp(16px,2.2vw,32px)}
    .emblem{display:inline-grid;place-items:center;width:46px;height:46px;background:#ffc94a;color:#12100e;font-weight:600;font-size:1.6rem;text-decoration:none}
    main{padding:0 clamp(16px,2.2vw,32px)}
    h1{margin:0 0 16px;font-weight:600;font-size:clamp(2.5rem,1.2rem + 5.4vw,6.5rem);line-height:.95;letter-spacing:-.045em;max-width:10em}
    p{margin:0 0 32px;max-width:36ch;color:#bdb7ae}
    .actions{display:flex;flex-wrap:wrap;gap:10px}
    .btn{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;font-weight:600;text-decoration:none;background:#2b2723}
    .btn.main{background:#ffc94a;color:#12100e}
    .giant{margin:0;padding:0 clamp(16px,2.2vw,32px);font-weight:600;font-size:clamp(64px,26.6vw,560px);line-height:.8;letter-spacing:-.055em;white-space:nowrap;transform:translateY(22%);color:#1d1a17}
  </style>
</head>
<body>
  <header class="top"><a class="emblem" href="/valyston/" aria-label="Valyston, pagina principală">V</a></header>
  <main>
    <h1>Pagina asta nu există.</h1>
    <p>Poate s-a schimbat adresa. Totul despre angajare și brutărie e pe pagina principală.</p>
    <div class="actions">
      <a class="btn main" href="/valyston/">Înapoi la Valyston</a>
      <a class="btn" href="tel:+40764154996">Sună: 0764 154 996</a>
    </div>
  </main>
  <p class="giant" aria-hidden="true">Valyston</p>
</body>
</html>
